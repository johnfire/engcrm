[project]
name = "general-crm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.32.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.0",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "httpx>=0.28.0",
    "mcp[cli]>=1.0.0",
    "gcrm-research-agent",
    "gcrm-enrichment-agent",
    "gcrm-scout-agent",
    "gcrm-opportunity-agent",
    "gcrm-outreach-agent",
    "gcrm-followup-agent",
    "duckduckgo-search>=8.1.1",
]

[project.optional-dependencies]
agents = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "duckduckgo-search>=6.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8",
]

[project.scripts]
supervisor = "gcrm.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gcrm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires TEST_DATABASE_URL and a real PostgreSQL instance",
    "e2e: exercises a main user flow against the real PostgreSQL instance",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]  # Long legacy prompts and data literals are refactored separately.

[tool.uv.sources]
gcrm-research-agent = { path = "agents/gcrm-research-agent", editable = true }
gcrm-enrichment-agent = { path = "agents/gcrm-enrichment-agent", editable = true }
gcrm-scout-agent = { path = "agents/gcrm-scout-agent", editable = true }
gcrm-opportunity-agent = { path = "agents/gcrm-opportunity-agent", editable = true }
gcrm-outreach-agent = { path = "agents/gcrm-outreach-agent", editable = true }
gcrm-followup-agent = { path = "agents/gcrm-followup-agent", editable = true }
