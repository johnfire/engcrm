[project]
name = "general-crm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "mcp[cli]>=1.0.0",
    "gcrm-research-agent",
    "gcrm-enrichment-agent",
    "gcrm-scout-agent",
    "gcrm-outreach-agent",
    "gcrm-followup-agent",
]

[project.optional-dependencies]
agents = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "duckduckgo-search>=6.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[project.scripts]
supervisor = "gcrm.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gcrm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv.sources]
gcrm-research-agent = { path = "agents/gcrm-research-agent", editable = true }
gcrm-enrichment-agent = { path = "agents/gcrm-enrichment-agent", editable = true }
gcrm-scout-agent = { path = "agents/gcrm-scout-agent", editable = true }
gcrm-outreach-agent = { path = "agents/gcrm-outreach-agent", editable = true }
gcrm-followup-agent = { path = "agents/gcrm-followup-agent", editable = true }
