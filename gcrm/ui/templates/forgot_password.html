<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EngCRM — Forgot password</title>
    <link rel="stylesheet" href="/static/style.css" />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .login-box {
        width: 320px;
        padding: 2rem;
        background: var(--surface, #1e1e2e);
        border-radius: 8px;
      }
      .login-box h1 {
        margin: 0 0 0.5rem;
        font-size: 1.2rem;
      }
      .login-box p.hint {
        color: #888;
        font-size: 0.85rem;
        margin: 0 0 1.5rem;
      }
      .login-box input {
        width: 100%;
        padding: 0.5rem 0.75rem;
        margin-bottom: 1rem;
        box-sizing: border-box;
      }
      .login-box button {
        width: 100%;
        padding: 0.5rem;
      }
      .login-box .back {
        display: block;
        margin-top: 1.5rem;
        text-align: center;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <h1>Forgot your password?</h1>
      {% if sent %}
      <p class="hint">
        If an account exists for that email, we've sent a link to reset your
        password. It's valid for 1 hour — check your inbox.
      </p>
      {% else %}
      <p class="hint">Enter your account email and we'll send you a reset link.</p>
      <form method="post" action="/forgot-password">
        <input
          type="email"
          name="email"
          placeholder="Email"
          autocomplete="username"
          autofocus
          required
        />
        <button type="submit">Send reset link</button>
      </form>
      {% endif %}
      <a class="back" href="/login">Back to sign in</a>
    </div>
  </body>
</html>
