<!doctype html>
<html lang="{{ request.session.get('ui_language', 'en') }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ t('forgotPassword.pageTitle') }}</title>
    <link rel="stylesheet" href="/static/style.css" />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .login-box {
        width: 320px;
        padding: 2rem;
        background: var(--surface, #1e1e2e);
        border-radius: 8px;
      }
      .login-box h1 {
        margin: 0 0 0.5rem;
        font-size: 1.2rem;
      }
      .login-box p.hint {
        color: #888;
        font-size: 0.85rem;
        margin: 0 0 1.5rem;
      }
      .login-box input {
        width: 100%;
        padding: 0.5rem 0.75rem;
        margin-bottom: 1rem;
        box-sizing: border-box;
      }
      .login-box button {
        width: 100%;
        padding: 0.5rem;
      }
      .login-box .back {
        display: block;
        margin-top: 1.5rem;
        text-align: center;
        font-size: 0.85rem;
      }
      .lang-toggle {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.75rem;
      }
      .lang-toggle a {
        opacity: 0.6;
      }
      .lang-toggle a.active {
        opacity: 1;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <h1>{{ t('forgotPassword.title') }}</h1>
      {% if sent %}
      <p class="hint">{{ t('forgotPassword.sentMessage') }}</p>
      {% else %}
      <p class="hint">{{ t('forgotPassword.hint') }}</p>
      <form method="post" action="/forgot-password">
        <input
          type="email"
          name="email"
          placeholder="{{ t('login.emailPlaceholder') }}"
          autocomplete="username"
          autofocus
          required
        />
        <button type="submit">{{ t('forgotPassword.submit') }}</button>
      </form>
      {% endif %}
      <a class="back" href="/login">{{ t('forgotPassword.backToSignIn') }}</a>
      <div class="lang-toggle">
        <a href="?lang=en" {% if request.session.get('ui_language', 'en') == 'en' %}class="active"{% endif %}>EN</a>
        &nbsp;|&nbsp;
        <a href="?lang=de" {% if request.session.get('ui_language', 'en') == 'de' %}class="active"{% endif %}>DE</a>
      </div>
    </div>
  </body>
</html>
