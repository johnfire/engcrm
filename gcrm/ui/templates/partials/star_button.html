<button
  type="button"
  class="star-btn{% if c.starred %} starred{% endif %}"
  hx-post="/organizations/{{ c.id }}/star"
  hx-swap="outerHTML"
  title="{{ t('organizations.unstar') if c.starred else t('organizations.star') }}"
  aria-label="{{ t('organizations.unstar') if c.starred else t('organizations.star') }}"
  aria-pressed="{{ 'true' if c.starred else 'false' }}"
>{{ '★' if c.starred else '☆' }}</button>
