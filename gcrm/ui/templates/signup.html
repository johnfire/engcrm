<!doctype html>
<html lang="{{ request.session.get('ui_language', 'en') }}"><head><meta charset="UTF-8"><title>{{ t('signup.pageTitle') }}</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="card" style="max-width:32rem;margin:4rem auto"><h1>{{ t('signup.title') }}</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/signup">
<label>{{ t('signup.emailLabel') }} <input type="email" name="email" required autocomplete="email"></label>
<label>{{ t('signup.nameLabel') }} <input name="name" autocomplete="name"></label>
<label>{{ t('signup.invitationLabel') }} <input name="invitation_token" required></label>
<label>{{ t('signup.passwordLabel') }} <input type="password" name="password" required minlength="12" autocomplete="new-password"></label>
<button type="submit">{{ t('signup.submit') }}</button></form><p><a href="/login">{{ t('signup.signIn') }}</a></p></main></body></html>
