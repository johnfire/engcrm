<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EngCRM — Reset password</title>
    <link rel="stylesheet" href="/static/style.css" />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .login-box {
        width: 320px;
        padding: 2rem;
        background: var(--surface, #1e1e2e);
        border-radius: 8px;
      }
      .login-box h1 {
        margin: 0 0 1.5rem;
        font-size: 1.2rem;
      }
      .login-box input {
        width: 100%;
        padding: 0.5rem 0.75rem;
        margin-bottom: 1rem;
        box-sizing: border-box;
      }
      .login-box button {
        width: 100%;
        padding: 0.5rem;
      }
      .error {
        color: #f38ba8;
        margin-bottom: 1rem;
        font-size: 0.9rem;
      }
      .login-box .back {
        display: block;
        margin-top: 1.5rem;
        text-align: center;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <h1>Set a new password</h1>
      {% if not valid %}
      <p class="error">This link is invalid or has expired.</p>
      <a class="back" href="/forgot-password">Request a new link</a>
      {% else %}
      {% if error %}
      <p class="error">{{ error }}</p>
      {% endif %}
      <form method="post" action="/reset-password">
        <input type="hidden" name="token" value="{{ token }}" />
        <input
          type="password"
          name="new_password"
          placeholder="New password"
          minlength="12"
          autocomplete="new-password"
          autofocus
          required
        />
        <button type="submit">Reset password</button>
      </form>
      {% endif %}
    </div>
  </body>
</html>
