services:
  app:
    # Image is built and pushed by CI (.github/workflows/backend.yml); the VPS pulls it.
    # For a local build instead, run: docker compose build (uses the Dockerfile).
    image: ghcr.io/johnfire/engcrm:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: engcrm-app
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/gcrm
    ports:
      - "8085:8000"
    volumes:
      # Business-card images (personal data) — persisted on the VPS, not in the image.
      - card-images:/data/card-images
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: engcrm-db
    environment:
      POSTGRES_DB: gcrm
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - engcrm-db-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d gcrm"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: engcrm-db-backup
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: gcrm
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 3
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  engcrm-db-data:
  card-images:
