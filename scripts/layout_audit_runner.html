<!doctype html><meta charset="utf-8"><title>layout audit</title>
<body style="background:#111;color:#ccc;font:13px monospace">
<div id="log">idle</div>
<iframe id="fr" style="border:1px solid #444;height:900px"></iframe>
<script>
const WIDTHS = [1600, 1280, 1024];
const LONG_TOKEN = "Klosterlechfeld-Musterstadt-Oberbayern-Schwaben";
const LONG_URL = "https://www.example-company-with-a-really-long-domain-name.de/path/to/a/page/";
const LONG_TEXT = "Ein sehr langer Freitext ueber die Firma und ihre Geschichte, der in eine Zelle gehoert.";
window.__results = null; window.__done = false; window.__progress = "";

function clippedByAncestor(el, win) {
  for (let p = el.parentElement; p; p = p.parentElement) {
    const o = win.getComputedStyle(p).overflowX;
    if (o !== "visible") return true;
  }
  return false;
}

function audit(doc, win, width) {
  const out = [];
  if (!doc.querySelector("link[rel=stylesheet]")) return out;  // bare htmx fragment
  if (doc.documentElement.scrollWidth > width + 1) {
    out.push({kind: "page-overflow", detail: doc.documentElement.scrollWidth + " > " + width});
  }
  doc.querySelectorAll("th,td,li,p,h1,h2,h3,a,span,div,button,label,select").forEach(el => {
    const cs = win.getComputedStyle(el);
    if (cs.overflowX !== "visible" || cs.display === "none" || cs.position === "fixed") return;
    if (el.scrollWidth <= el.clientWidth + 1) return;
    const text = (el.textContent || "").trim().replace(/\s+/g, " ").slice(0, 28);
    if (!text) return;
    if (Array.from(el.children).some(c => c.scrollWidth > c.clientWidth + 1 &&
        win.getComputedStyle(c).overflowX === "visible")) return;
    if (clippedByAncestor(el, win)) return;
    out.push({kind: "spill", sel: el.tagName.toLowerCase() + (el.className ? "." + String(el.className).split(" ")[0] : ""),
              text: text, scroll: el.scrollWidth, client: el.clientWidth, nowrap: cs.whiteSpace === "nowrap"});
  });
  return out;
}

// Replace each cell's longest text node with a hostile value, so a column that
// only copes with the test fixture's short strings is exposed.
function stress(doc) {
  doc.querySelectorAll("td,th").forEach((cell, i) => {
    const walker = doc.createTreeWalker(cell, NodeFilter.SHOW_TEXT);
    let best = null, node;
    while ((node = walker.nextNode())) {
      if (node.nodeValue.trim() && (!best || node.nodeValue.length > best.nodeValue.length)) best = node;
    }
    if (!best) return;
    if (cell.classList.contains("nowrap")) return;          // ISO dates, numbers
    if (best.parentElement.closest(".badge, .personal-priority-badge")) return;  // fixed vocabulary
    best.nodeValue = [LONG_TOKEN, LONG_URL, LONG_TEXT][i % 3];
  });
}

async function runAll(pages, doStress) {
  const fr = document.getElementById("fr"), log = document.getElementById("log");
  const all = [];
  for (const page of pages) {
    for (const w of WIDTHS) {
      fr.style.width = w + "px";
      await new Promise(res => { fr.onload = res; fr.src = "/static/_layout_audit/" + page + "?w=" + w; });
      await new Promise(res => setTimeout(res, 20));
      let found = [];
      try {
        if (doStress) { stress(fr.contentDocument); await new Promise(res => setTimeout(res, 20)); }
        found = audit(fr.contentDocument, fr.contentWindow, w);
      } catch (e) { found = [{kind: "error", detail: String(e)}]; }
      if (found.length) all.push({page: page.replace("page_", "").replace(".html", ""), width: w, findings: found});
      window.__progress = page + "@" + w;
      log.textContent = "auditing " + window.__progress + " — " + all.length + " combos with findings";
    }
  }
  window.__results = all; window.__done = true;
  log.textContent = "done: " + all.length + " page/width combos with findings";
}

window.PAGES = [];
fetch("pages.json").then(r => r.json()).then(p => {
  window.PAGES = p;
  document.getElementById("log").textContent =
    p.length + " pages loaded — run runAll(PAGES, false), then runAll(PAGES, true)";
});
</script>
