[project]
name = "gcrm-enrichment-agent"
version = "0.1.0"
requires-python = ">=3.11"
description = "LangGraph agent that enriches existing contacts with missing website and email data."
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=1.5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gcrm_enrichment_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
