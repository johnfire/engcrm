name: backend

on:
  push:
    branches: [main]
    paths:
      - "gcrm/**"
      - "agents/**"
      - "tests/**"
      - "scripts/**"
      - "engcrm-interview-agent/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "gcrm/**"
      - "agents/**"
      - "tests/**"
      - "scripts/**"
      - "engcrm-interview-agent/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  # TEMP: renamed from "backend-deploy" to dodge a permanently zombie-queued
  # run (32986377963) from the 2026-08-26 GitHub Actions outage that GitHub's
  # API refuses to cancel or delete, and which was blocking the old group
  # forever. Revert this rename once a deploy has gone through cleanly.
  group: backend-deploy-2026-08-26
  cancel-in-progress: false

# Default for every job; build-deploy overrides it below with the packages:write
# it needs to push to GHCR, so the test job can't inherit a token that can.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gcrm_test
          POSTGRES_USER: artcrm_admindude
          POSTGRES_PASSWORD: gcrm_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artcrm_admindude -d gcrm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://artcrm_admindude:gcrm_test_password@localhost:5432/gcrm_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync --extra agents --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Dependency audit
        run: uv run --with pip-audit pip-audit
      - name: Run unit tests
        run: |
          uv run pytest tests -q -m "not integration and not e2e and not network"
          for a in research scout enrichment outreach followup; do
            uv run pytest "agents/gcrm-$a-agent/tests" -q
          done
      - name: Run real-PostgreSQL integration tests
        run: uv run pytest tests/integration -q
      - name: Run web and mobile e2e smoke tests
        run: uv run pytest tests/e2e -q

  build-deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/johnfire/engcrm:latest
            ghcr.io/johnfire/engcrm:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to VPS (pull + migrate + restart)
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER
          script_stop: true
          script: |
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd /opt/engcrm
            sudo docker compose pull app
            sudo docker compose run --rm app uv run python scripts/migrate.py
            sudo docker compose up -d app
            sudo docker image prune -f
