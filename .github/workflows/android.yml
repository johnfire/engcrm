name: android

on:
  push:
    branches: [main]
    paths:
      - "engcrm-mobile/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "engcrm-mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  # Fast gate: typecheck + unit tests. The (slow) build only runs if this passes.
  mobile-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engcrm-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: engcrm-mobile/package-lock.json
      - name: Install JS deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Unit tests
        run: npm test

  build:
    if: github.event_name == 'push'
    needs: mobile-test
    # Self-hosted runner on the laptop (free, fast, has the Android toolchain).
    # Falls back to nothing if the laptop is off — the job queues until it's up.
    runs-on: [self-hosted, android]
    env:
      # Empty unless the secret is set — the Play submit step is skipped when empty.
      PLAY_SA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    defaults:
      run:
        working-directory: engcrm-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: engcrm-mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('engcrm-mobile/android/**/*.gradle*', 'engcrm-mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Install JS deps
        run: npm ci
      - name: Install NDK + cmake
        run: sdkmanager "ndk;27.1.12297006" "cmake;3.22.1"
      - name: Write signing config from secrets
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/upload.keystore
          cat > android/keystore.properties <<EOF
          ENGCRM_UPLOAD_STORE_FILE=$(pwd)/android/upload.keystore
          ENGCRM_UPLOAD_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          ENGCRM_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ENGCRM_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
      - name: Build signed AAB
        # arm64-v8a only — covers virtually all modern devices; keeps the 4-core
        # runner's native compile fast. Add armeabi-v7a back for a production track
        # if you need 32-bit/legacy device coverage.
        run: cd android && ./gradlew bundleRelease --no-daemon -PengcrmVersionCode=${{ github.run_number }} -PreactNativeArchitectures=arm64-v8a
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: engcrm-release-aab
          path: engcrm-mobile/android/app/build/outputs/bundle/release/app-release.aab
      - name: Submit to Google Play (internal track)
        if: ${{ env.PLAY_SA != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_SA }}
          packageName: de.christopherrehm.engcrm
          releaseFiles: engcrm-mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
